root.addEventListener('click',event=>{
 if(!event.target.closest('[data-create-work]'))return;
 const form=root.querySelector('[data-work-form]');if(!form.reportValidity())return;
 const data=new FormData(form),name=String(data.get('name')).trim();if(!name)return;
 const isTask=data.get('kind')==='task',parent=isTask?'project':String(data.get('owner')),repo=isTask?String(data.get('repo')):entities[parent].repo,key='work'+Date.now();
 entities[key]={name,parent,repo,role:isTask?'Task orchestrator':'Implementation worker',provider:String(data.get('provider')),branch:isTask?null:'agent/'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),status:'Ready',ownIn:0,ownOut:0,description:'New '+(isTask?'task coordinated within the project.':'agent managed by '+entities[parent].name+'.'),intro:isTask?'Ready to plan this task and delegate work to its agents.':'Ready for an assignment from '+entities[parent].name+'.',context:'New assignment',detail:'Project context remains available by reference.'};
 state.newEntities.push(key);navigate(key);
});

function workspaceEmpty(kind){const e=entities[state.entity];return `<div class="view-head"><h2>${kind==='pr'?'No pull request':e.role==='Review agent'?'Read-only assignment':'No integration workspace'}</h2><p>${kind==='pr'?'This agent has no pull request of its own.':e.role==='Review agent'?'This reviewer inspects task changes without owning a writable branch.':'A task can coordinate agents before allocating an integration branch.'}</p></div>${e.parent?button('Inspect owning task',`data-agent="${e.parent}" data-next="${kind}"`,'outline'):''}`;}

root.addEventListener('pointerdown',event=>{
 const handle=event.target.closest('[data-resize]');if(!handle)return;
 event.preventDefault();const kind=handle.dataset.resize,start=event.clientX,property=kind==='sidebar'?'--sidebar-width':'--inspector-width';
 const pane=root.querySelector(kind==='sidebar'?'.sidebar':'.inspector'),width=pane.getBoundingClientRect().width;
 handle.setPointerCapture(event.pointerId);
 const move=e=>{const delta=(e.clientX-start)*(kind==='sidebar'?1:-1);root.style.setProperty(property,Math.max(kind==='sidebar'?210:280,Math.min(kind==='sidebar'?500:560,width+delta))+'px');};
 const stop=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',stop);handle.removeEventListener('pointercancel',stop);};
 handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',stop);handle.addEventListener('pointercancel',stop);
});
root.addEventListener('keydown',event=>{
 const handle=event.target.closest('[data-resize]');if(!handle||!['ArrowLeft','ArrowRight'].includes(event.key))return;
 event.preventDefault();const sidebar=handle.dataset.resize==='sidebar',property=sidebar?'--sidebar-width':'--inspector-width';
 const width=root.querySelector(sidebar?'.sidebar':'.inspector').getBoundingClientRect().width;
 root.style.setProperty(property,Math.max(sidebar?210:280,Math.min(sidebar?500:560,width+(event.key==='ArrowRight'?20:-20)*(sidebar?1:-1)))+'px');
});

// Live work stream study: a scripted turn drives the activity card, turn summary and history drawer.
// Sample steps only; no provider output is read.
const stepKinds={command:'terminal',edit:'pencil',search:'search',read:'file-text',plan:'list-checks',tool:'send'};
const startupTurn=[
 {n:'Reading the startup harness to see how timings are captured.'},
 {k:'search',t:'rg "performance.mark" src/',m:'6 matches'},
 {k:'read',t:'src/startup/metrics.ts'},
 {n:'Timings come from `performance.mark` around module init. Running the current suite for a baseline:'},
 {k:'command',t:'npm test -- startup',m:'4.2s',ticks:4,d:'PASS tests/startup.test.ts\n  ✓ cold start under budget (812 ms)\n  ✓ warm start (143 ms)\n\nTests: 2 passed'},
 {n:'Cold start is noisy from run to run. Adding a baseline that takes the median of 15 runs:'},
 {k:'plan',t:'Plan · 1 of 3 done',d:'✓ Measure current cold start\n◻ Add a median-of-15 harness\n◻ Record the baseline in docs'},
 {k:'edit',t:'tests/startup/baseline.test.ts',m:'+64'},
 {k:'edit',t:'src/startup/metrics.ts',m:'+9 −2'},
 {k:'command',t:'npm test -- startup/baseline',m:'38s',ticks:5,fail:true,d:'FAIL tests/startup/baseline.test.ts\n  ✕ median cold start is stable\n    Expected spread < 10%, received 23%'},
 {n:'Spread is 23%. The first run pays for the module cache, so I’m discarding it as a warm-up:'},
 {k:'edit',t:'tests/startup/baseline.test.ts',m:'+4 −1'},
 {k:'command',t:'npm test -- startup/baseline',m:'41s',ticks:5,d:'PASS tests/startup/baseline.test.ts\n  ✓ median cold start is stable (spread 6%)'},
 {k:'plan',t:'Plan · 2 of 3 done',d:'✓ Measure current cold start\n✓ Add a median-of-15 harness\n◻ Record the baseline in docs'},
 {n:'Baseline is stable at a 798 ms median. Recording it in `docs/performance.md`, then reporting.'},
 {k:'edit',t:'docs/performance.md',m:'+18'},
 {k:'tool',t:'report · ready_for_testing'},
 {reply:'Baseline recorded: median cold start is **798 ms** with a 6% spread over 15 runs. I added `tests/startup/baseline.test.ts`, discard the warm-up run, and documented the method in `docs/performance.md`. Reported ready for testing.'}
];
const themeTurn=[
 {n:'Replacing hard-coded toolbar colors with semantic tokens from the palette contract.'},
 {k:'search',t:'rg "#1B2632|#EEE9DF" src/',m:'4 matches'},
 {k:'edit',t:'src/theme/tokens.ts',m:'+18 −8'},
 {k:'command',t:'npm run typecheck',m:'6.1s',d:'No type errors.'},
 {n:'The fallback still uses a fixed color, which breaks the Sky variant. Switching it to the surface role:'},
 {k:'edit',t:'src/theme/fallback.ts',m:'+3 −3'},
 {k:'command',t:'npm test -- theme',m:'12s',fail:true,d:'✕ Sky variant has a focus role\n  Expected role "focus" to be defined'},
 {n:'Sky was missing the focus role in its generated export. Regenerating the variants:'},
 {k:'command',t:'npm run palette:generate',m:'2.3s',d:'4 variants written'},
 {k:'command',t:'npm test -- theme',m:'11s',d:'Tests: 42 passed'},
 {k:'tool',t:'report · ready_for_testing'}
];
const turns={theme:{events:themeTurn,shown:themeTurn.length,done:true,seconds:401}};
const openDetails=new Set();
let turnTimer=null;
function inline(text){return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function clock(s){s=Math.floor(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function liveWorker(key){const e=entities[key];return key!=='project'&&e.role!=='Task orchestrator'&&!state.paused[key]&&agentPhase(key).kind==='working';}
function turnFor(key){if(!turns[key]&&liveWorker(key))turns[key]={events:startupTurn,shown:1,wait:2,done:false,started:Date.now(),offset:251};return turns[key];}
function seconds(turn){return turn.done?turn.seconds:turn.offset+(Date.now()-turn.started)/1000;}
function revealed(turn){return turn.events.slice(0,turn.shown).filter(e=>!e.reply);}
function steps(turn){return revealed(turn).filter(e=>!e.n);}
function stepState(turn,event){const last=revealed(turn).at(-1);if(!turn.done&&event===last)return 'run';return event.fail?'bad':'ok';}
function glyph(state){return `<span class="glyph ${state}">${state==='run'?`<span class="wt-spin">${icon('loader-circle')}</span>`:icon(state==='bad'?'x':'check')}</span>`;}
function stepRow(turn,event,fresh){const s=stepState(turn,event);return `<li class="step-row ${fresh?'new':''}">${glyph(s)}<span class="kind">${icon(stepKinds[event.k])}</span><span class="title">${esc(event.t)}</span><span class="meta">${s==='run'?'running':esc(event.m||'')}</span></li>`;}
function durationLabel(s){s=Math.round(s);return s<60?`${s}s`:`${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`;}
function activityCard(key){
 const turn=turns[key],list=steps(turn),recent=list.slice(-3),last=revealed(turn).at(-1),narration=revealed(turn).filter(e=>e.n).at(-1),streaming=last===narration,min=state.activityMinimized;
 const current=last?(last.n?inline(last.n):esc(last.t)):'Starting…';
 return `<div class="activity-card ${min?'minimized':''}"><div class="ac-head"><button class="ac-open" data-turn="${key}" aria-label="Show this turn’s work history"><span class="glyph run"><span class="wt-spin">${icon('loader-circle')}</span></span><strong>Working</strong><span class="ac-stats">· ${clock(seconds(turn))} · ${list.length} step${list.length===1?'':'s'}</span><span class="ac-current ${last&&!last.n?'mono':''}">${current}</span><span class="ac-view">View all ${icon('chevron-right')}</span></button>${button(icon('chevron-up'),`data-activity-toggle aria-expanded="${!min}" aria-label="${min?'Show':'Minimize'} live activity" data-tooltip="${min?'Show':'Minimize'} live activity"`,'ac-toggle')}</div><button class="ac-body" data-turn="${key}" tabindex="${min?-1:0}" aria-hidden="${min}"><p class="ac-narration ${streaming?'streaming':''}">${narration?inline(narration.n):'Starting…'}</p><ul class="ac-steps">${recent.map((e,i)=>stepRow(turn,e,i===recent.length-1&&!streaming)).join('')}</ul></button></div>`;
}
function turnSummary(key){const turn=turns[key],list=steps(turn),failed=list.filter(e=>e.fail).length;return `<button class="turn-summary" data-turn="${key}">${icon('chevron-right')}Worked ${durationLabel(turn.seconds)} · ${list.length} steps${failed?` · <span class="bad">${failed} failed</span>`:''}</button>`;}
function turnRegion(key){
 const turn=turnFor(key);if(!turn||key==='theme')return '';
 if(!turn.done)return `<div data-turn-region>${activityCard(key)}</div>`;
 const reply=turn.events.find(e=>e.reply);
 return `<div data-turn-region><div class="message">${turnSummary(key)}<div class="by"><span>${esc(entities[key].provider)} · ${esc(entities[key].name)}</span><span>Now</span></div><p>${inline(reply.reply)}</p></div></div>`;
}
function turnHistory(key){
 const turn=turns[key],groups=[];
 for(const event of revealed(turn)){if(event.n||!groups.length)groups.push({n:event.n,steps:[]});if(!event.n)groups.at(-1).steps.push(event);}
 return groups.map((g,gi)=>`<section class="turn-group">${g.n?`<p>${inline(g.n)}</p>`:''}${g.steps.map((e,si)=>{const id=`${key}:${gi}:${si}`,row=`<ul class="ac-steps" style="display:block">${stepRow(turn,e,false)}</ul>`;return e.d?`<details data-step="${id}" ${openDetails.has(id)?'open':''}><summary>${row}</summary><pre>${esc(e.d)}</pre></details>`:row;}).join('')}</section>`).join('');
}
function turnMeta(key){const turn=turns[key],n=steps(turn).length;return turn.done?`${icon('check')} Worked ${durationLabel(turn.seconds)} · ${n} steps`:`<span class="glyph run"><span class="wt-spin">${icon('loader-circle')}</span></span> Working · ${clock(seconds(turn))} · ${n} steps`;}
function turnSheet(key){return `<section class="sheet turn-sheet" role="dialog" aria-modal="true" aria-label="Turn history"><header class="between"><h2>${esc(entities[key].name)} · this turn</h2>${button(icon('x'),'data-close aria-label="Close turn history"')}</header><div class="turn-meta">${turnMeta(key)}</div><div class="sheet-body">${turnHistory(key)}</div><div class="turn-foot">Simulated turn · sample steps, not provider output · Esc to close</div></section>`;}
const baseChat=chat,baseSeedMessage=seedMessage,baseRenderSheet=renderSheet,baseRender=render;
seedMessage=function(){const html=baseSeedMessage();return state.entity==='theme'?html.replace('<div class="message">',`<div class="message">${turnSummary('theme')}`):html;};
chat=function(){return baseChat().replace('</div><div class="chat-composer-area">',`${turnRegion(state.entity)}</div><div class="chat-composer-area">`);};
renderSheet=function(){const host=root.querySelector('.sheet-host');const turn=state.sheet?.kind==='turn';host?.classList.toggle('drawer',turn);if(turn){host.innerHTML=turnSheet(state.sheet.value);return;}baseRenderSheet();};
render=function(){baseRender();syncTurnTimer();};
function refreshTurn(key){
 const region=root.querySelector('[data-turn-region]');if(region)region.outerHTML=turnRegion(key);
 if(state.sheet?.kind==='turn'&&state.sheet.value===key){const body=root.querySelector('.turn-sheet .sheet-body'),following=body.scrollHeight-body.scrollTop-body.clientHeight<24,top=body.scrollTop;root.querySelector('.turn-sheet .turn-meta').innerHTML=turnMeta(key);body.innerHTML=turnHistory(key);body.scrollTop=following?body.scrollHeight:top;}
 icons();
}
function syncTurnTimer(){
 const turn=turns[state.entity],active=turn&&!turn.done;
 if(active&&!turnTimer)turnTimer=setInterval(()=>{const key=state.entity,t=turns[key];if(!t||t.done){syncTurnTimer();return;}if(--t.wait<=0){t.shown++;const next=t.events[t.shown-1];t.wait=next?.ticks||2;if(next?.reply){t.seconds=seconds(t);t.done=true;}}refreshTurn(key);if(t.done)syncTurnTimer();},1000);
 if(!active&&turnTimer){clearInterval(turnTimer);turnTimer=null;}
}
root.addEventListener('click',event=>{
 const trigger=event.target.closest('[data-turn]');if(trigger){openSheet('turn',trigger.dataset.turn);return;}
 if(event.target.matches('.sheet-host.drawer'))closeSheet();
});
root.addEventListener('click',event=>{
 const toggle=event.target.closest('[data-activity-toggle]');if(!toggle)return;
 state.activityMinimized=!state.activityMinimized;remember();
 // Flip the class in place so the height animates; the next tick re-renders the same state.
 const min=state.activityMinimized,label=(min?'Show':'Minimize')+' live activity';
 toggle.closest('.activity-card').classList.toggle('minimized',min);
 toggle.setAttribute('aria-expanded',String(!min));toggle.setAttribute('aria-label',label);toggle.dataset.tooltip=label;
});
state.activityMinimized=priv.activityMinimized===true;
root.addEventListener('toggle',event=>{const id=event.target.dataset?.step;if(!id)return;event.target.open?openDetails.add(id):openDetails.delete(id);},true);

render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'atmosphere',{label:'Ambient color'});tweak.addSlider(design,'radius',{label:'Window corner radius',min:4,max:24,unit:'px'});tweak.addSlider(design,'spacing',{label:'Workspace spacing',min:14,max:24,unit:'px'});}
})();
</script>
