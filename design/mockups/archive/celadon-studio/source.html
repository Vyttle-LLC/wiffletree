#celadon-studio .glaze{position:absolute;width:136px;height:75px;left:45px;top:-17px;transform:rotate(-35deg);border-radius:50%;background:radial-gradient(ellipse at 40% 20%,var(--text),var(--green) 22%,var(--surface) 63%,var(--base) 72%);box-shadow:inset 0 -6px 7px color-mix(in srgb,var(--blue) 30%,var(--base)),0 14px 25px color-mix(in srgb,var(--green) 15%,transparent)}
#celadon-studio .glaze:after{content:"";position:absolute;inset:13px 16px;border-radius:50%;background:radial-gradient(ellipse at 40% 50%,var(--base) 15%,var(--surface) 50%,var(--green) 110%);box-shadow:inset 1px 3px 7px color-mix(in srgb,var(--base) 80%,transparent)}
#celadon-studio .cover-caption{position:absolute;left:11px;bottom:11px;font:400 16px/1 Georgia,serif;letter-spacing:.03em;color:var(--text);text-shadow:0 1px 7px var(--base)}
#celadon-studio .cover-caption span{display:block;font:8px/1.5 ui-monospace,monospace;letter-spacing:.1em;margin-top:5px;color:var(--subtle)}
#celadon-studio .heading-actions{padding-top:0}
#celadon-studio .map-worker{margin-left:11px;padding-left:13px;border-left:1px solid var(--edge)}
#celadon-studio .map-worker:before{left:0;top:44px;height:1px;width:13px}
#celadon-studio .feature-child{position:relative;padding:15px 0 0 13px;margin-left:10px;border-left:1px solid var(--edge)}
#celadon-studio .feature-child:before{content:"";position:absolute;top:43px;left:0;width:13px;height:1px;background:var(--edge)}
#celadon-studio .map-worker.feature .feature-child .node{border-style:solid}
#celadon-studio .map-worker .node .meta{font-size:10px}
#celadon-studio .node .provider{font-size:9px}
#celadon-studio .tree .depth3{border-left:1px solid var(--edge);margin-left:20px;padding-left:16px;width:calc(100% - 20px)}
@media(max-width:1100px){#celadon-studio .project-cover{width:116px;height:96px}#celadon-studio .heading h1{font-size:35px}#celadon-studio .map .node .provider{display:none}}
@media(max-width:540px){#celadon-studio .project-cover{display:none}#celadon-studio .heading h1{font-size:33px}}


#celadon-studio .green{color:var(--read-green,var(--green))}#celadon-studio .yellow{color:var(--read-yellow,var(--yellow))}#celadon-studio .red{color:var(--read-red,var(--red))}#celadon-studio .blue{color:var(--read-blue,var(--blue))}
#celadon-studio .sidebar .active,#celadon-studio .tree .tree-selected{color:var(--read-green,var(--green))}
#celadon-studio .eyebrow,#celadon-studio .tag,#celadon-studio .small,#celadon-studio .node .meta,#celadon-studio .node .provider,#celadon-studio .map .node .meta,#celadon-studio .map-foot,#celadon-studio .feed-row time,#celadon-studio .feed-row p,#celadon-studio .chat-header .eyebrow,#celadon-studio .chat-header .small,#celadon-studio .message .by,#celadon-studio .message .receipt,#celadon-studio .context-card p,#celadon-studio .suggestions button,#celadon-studio .compose label,#celadon-studio .chat-bottom,#celadon-studio .statusbar,#celadon-studio .commit small,#celadon-studio .repo-pick small,#celadon-studio .job .last-run,#celadon-studio .capacity-row p,#celadon-studio .note p,#celadon-studio .theme-choice small,#celadon-studio .scope-breadcrumb,#celadon-studio .scope-breadcrumb button,#celadon-studio .host p{font-size:11px}
#celadon-studio .eyebrow{letter-spacing:.08em}#celadon-studio .node .meta{flex-wrap:wrap}
#celadon-studio .code-row{font-size:11px}
#celadon-studio .code-row.add{color:var(--read-green,var(--green))}#celadon-studio .code-row.del{color:var(--read-red,var(--red))}

</style>
<script>
(()=>{
const root=document.getElementById('celadon-studio');
const palettes={"celadon":{"slug":"celadon","name":"Celadon","appearance":"dark","palette":{"base":"#131b11","surface":"#182216","overlay":"#232f20","muted":"#727e70","subtle":"#939f91","text":"#c9d5c6","red":"#fba29b","green":"#9ecf75","yellow":"#dcbb50","blue":"#7cc7fb","magenta":"#f49cdb","cyan":"#37d8c9","br_red":"#fec4be","br_green":"#b6e68f","br_yellow":"#f1d26f","br_blue":"#abdbfe","br_magenta":"#ffbceb","br_cyan":"#62efdf"}},"celadon-powder":{"slug":"celadon-powder","name":"Celadon Powder","appearance":"dark","palette":{"base":"#232b21","surface":"#273125","overlay":"#303c2d","muted":"#707c6e","subtle":"#8b9689","text":"#b5c1b2","red":"#ea928c","green":"#8fbf65","yellow":"#ccab3e","blue":"#6cb7ea","magenta":"#e38ccb","cyan":"#14c8b9","br_red":"#e8b0aa","br_green":"#a2d17b","br_yellow":"#dcbd5a","br_blue":"#97c6e9","br_magenta":"#e9a8d6","br_cyan":"#48daca"}},"celadon-jade":{"slug":"celadon-jade","name":"Celadon Jade","appearance":"dark","palette":{"base":"#060d05","surface":"#0b150a","overlay":"#182315","muted":"#748072","subtle":"#9ba799","text":"#dbe7d8","red":"#ffb7b0","green":"#acde83","yellow":"#ebca60","blue":"#99d4ff","magenta":"#ffaee7","cyan":"#4ce7d8","br_red":"#fedfdb","br_green":"#c9f9a1","br_yellow":"#ffe697","br_blue":"#d1ebfe","br_magenta":"#ffdbf3","br_cyan":"#8ffff1"}},"celadon-sky":{"slug":"celadon-sky","name":"Celadon Sky","appearance":"light","palette":{"base":"#eaf6e8","surface":"#deedda","overlay":"#cee1ca","muted":"#7a8378","subtle":"#5d675b","text":"#3b423a","red":"#9b4a43","green":"#40783b","yellow":"#9c7220","blue":"#246099","magenta":"#874576","cyan":"#1c7472","br_red":"#84312b","br_green":"#266221","br_yellow":"#825b00","br_blue":"#004982","br_magenta":"#702d60","br_cyan":"#005c5a"}}};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(text,attrs='',cls='')=>`<button type="button" class="cursor-interaction ${cls}" ${attrs}>${text}</button>`;
const entities={
 project:{name:'Celadon',role:'Project orchestrator',provider:'Claude',parent:null,repo:null,status:'Coordinating',ownIn:22000,ownOut:6300,description:'One theme language. Two repositories, moving together.',intro:'The shared palette is ready. Chrome has one review thread to address and one browser test waiting for your approval.',context:'Two things need your attention',detail:'Everything else can continue independently.'},
 chrome:{name:'Google-Chrome',role:'Repository coordinator',provider:'Claude',parent:'project',repo:'Google-Chrome',branch:'origin/main',status:'Coordinating',ownIn:18000,ownOut:4800,description:'Coordinate the extension, review worker PRs, and keep the integration branch current.',intro:'Theme-init is ready for review. Theme overhaul owns the integration branch; toolbar-styling is waiting on its browser test.',context:'Integration target · origin/main',detail:'Worker history and PRs remain independently inspectable.'},
 theme:{name:'theme-init',role:'Implementation worker',provider:'Codex',parent:'chrome',repo:'Google-Chrome',branch:'theme-init',pr:42,status:'In review',ownIn:84000,ownOut:14200,description:'Replace hardcoded extension colors with semantic Celadon tokens.',intro:'The semantic token migration is ready. I have three commits on this branch and one reviewer question about the fallback color.',context:'PR #42 · one open thread',detail:'Select commits in Git to prepare a squash instruction.'},
 feature:{name:'Theme overhaul',role:'Feature coordinator',provider:'Claude',parent:'chrome',repo:'Google-Chrome',branch:'feature/theme-overhaul',pr:47,status:'Integrating',ownIn:21000,ownOut:5200,description:'Own the feature branch and combine worker PRs before final integration.',intro:'The token foundation has landed on the feature branch. Toolbar styling is the remaining worker PR; combined checks run after it integrates.',context:'toolbar-styling → feature/theme-overhaul',detail:'I own the integration order and the final PR into main.'},
 toolbar:{name:'toolbar-styling',role:'Implementation worker',provider:'Codex',parent:'feature',repo:'Google-Chrome',branch:'toolbar-styling',pr:44,status:'Needs approval',ownIn:61000,ownOut:10500,description:'Apply the Celadon palette to toolbar, focus, and inactive states.',intro:'The toolbar changes are ready for a browser test. I need approval to launch the test process on Studio before I can continue.',context:'Approval · browser integration test',detail:'Host: Studio · Linux. Branch: toolbar-styling.'},
 paletteRepo:{name:'Celadon-Theme',role:'Repository coordinator',provider:'Claude',parent:'project',repo:'Celadon-Theme',branch:'origin/main',status:'Coordinating',ownIn:12000,ownOut:2900,description:'Keep the generated palette and downstream ports consistent.',intro:'Palette-update is checking the exported roles across all four variants. Chrome is consuming the same semantic names.',context:'One palette source',detail:'Celadon, Powder, Jade and Sky are generated together.'},
 palette:{name:'palette-update',role:'Implementation worker',provider:'Claude',parent:'paletteRepo',repo:'Celadon-Theme',branch:'palette-update',pr:18,status:'Working',ownIn:74000,ownOut:11900,description:'Verify all four generated palettes and their shared export contract.',intro:'The generated palette exports are aligned. I’m checking the contrast report and downstream token names before handing this back.',context:'Draft PR #18',detail:'The generated JSON is the shared source for the app theme.'}
};
const saved=window.openai?.widgetState;const model=saved?.modelContent||{};const priv=saved?.privateContent||{};
const state={entity:entities[model.agent]?model.agent:'project',view:['overview','git','changes','pr','brain','schedule','usage','activity'].includes(model.view)?model.view:'overview',theme:palettes[model.theme]||model.theme==='system'?model.theme:'celadon',selected:Array.isArray(priv.selected)?priv.selected.filter(x=>typeof x==='string'):[],drafts:priv.drafts&&typeof priv.drafts==='object'?priv.drafts:{},messages:{},paused:{},approval:false,reviewResolved:false,compiled:false,decisionResolved:false,jobsPaused:{},jobRuns:{},day:3,sheet:null,notice:'',newEntities:[]};
const design={atmosphere:true,radius:18,spacing:20};
const allTabs=[['overview','Overview'],['git','Git'],['changes','Changes'],['pr','Pull requests'],['activity','Activity']];
const themeNames={celadon:'Celadon','celadon-powder':'Powder','celadon-jade':'Jade','celadon-sky':'Sky',system:'System'};
const initialCommits=[['0b57a9e','Fix missing-token fallback'],['9c321de','Align toolbar contrast'],['f85ab20','Introduce semantic theme tokens'],['81ef019','Update extension permissions'],['6025dac','Simplify toolbar state'],['14f0a82','Add browser theme support']];
function commits(){if(['theme','chrome'].includes(state.entity))return initialCommits;const palette=entities[state.entity].repo==='Celadon-Theme';const titles=palette?['Align exported role names','Regenerate four theme variants','Update palette contract','Update generator metadata','Add contrast gates','Introduce palette source']:['Correct toolbar focus state','Align inactive foreground','Apply semantic toolbar tokens','Integrate token foundation','Add semantic tokens','Add toolbar baseline'];return titles.map((t,i)=>[['c6d91f0','827da51','0ea2cd4','81ef019','6025dac','14f0a82'][i],t]);}
function effectiveTheme(){return state.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'celadon':'celadon-sky'):state.theme;}
function luminance(hex){const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722;}
function contrast(a,b){const l=[luminance(a),luminance(b)].sort((a,b)=>a-b);return (l[1]+.05)/(l[0]+.05);}
function readable(color,p){let result=color;for(let step=0;step<=20;step++){const fraction=step/20;result='#'+[1,3,5].map(i=>Math.round(parseInt(color.slice(i,i+2),16)*(1-fraction)+parseInt(p.text.slice(i,i+2),16)*fraction).toString(16).padStart(2,'0')).join('');if(['base','surface','overlay'].every(k=>contrast(result,p[k])>=4.5))break;}return result;}
function applyTheme(){const p=palettes[effectiveTheme()];Object.entries(p.palette).forEach(([k,v])=>root.style.setProperty('--'+k,v));root.style.setProperty('--subtle',readable(p.palette.subtle,p.palette));for(const role of ['green','yellow','red','blue'])root.style.setProperty('--read-'+role,readable(p.palette[role],p.palette));root.style.colorScheme=p.appearance;root.style.setProperty('--round',design.radius+'px');root.style.setProperty('--space',design.spacing+'px');}
function remember(){window.openai?.setWidgetState?.({modelContent:{agent:state.entity,view:state.view,theme:state.theme},privateContent:{drafts:Object.fromEntries(Object.entries(state.drafts).slice(-8).map(([k,v])=>[k,String(v).slice(0,1200)])),selected:state.selected}})?.catch(()=>{});}
function childKeys(key){return Object.keys(entities).filter(k=>entities[k].parent===key);}
function descendants(key){return [key,...childKeys(key).flatMap(descendants)];}
function totals(key){return descendants(key).reduce((a,k)=>({input:a.input+entities[k].ownIn,output:a.output+entities[k].ownOut}),{input:0,output:0});}
function status(key){if(state.paused[key])return 'Paused';if(key==='toolbar'&&state.approval)return 'Testing';if(key==='theme'&&state.reviewResolved)return 'Review addressed';return entities[key].status;}
function tree(){function node(key,depth){const e=entities[key];return button(`${icon(childKeys(key).length?'chevron-down':e.role==='Feature coordinator'?'git-merge':'circle-small')}<span class="tree-name">${esc(e.name)}</span>`,`data-agent="${key}" aria-pressed="${state.entity===key}"`,`depth${depth} ${state.entity===key?'tree-selected':''}`)+childKeys(key).map(k=>node(k,depth+1)).join('');}return node('project',0);}
function navigate(entity,view){state.entity=entity;state.view=view||(entity==='project'?'overview':'git');state.selected=[];state.notice='';render();remember();}
function breadcrumb(){const parts=[];let k=state.entity;while(k){parts.unshift(k);k=entities[k].parent;}return parts.map(k=>button(esc(entities[k].name),`data-agent="${k}"`)).join('<span>/</span>');}
function seedMessage(){const e=entities[state.entity];const intro=state.entity==='project'&&state.approval?(state.decisionResolved?'The browser test is approved and the fallback decision is reconciled. Chrome can continue integrating the shared palette.':'The browser test is approved. One fallback decision is still waiting for a ruling in the project brain.'):state.entity==='toolbar'&&state.approval?'The browser test has been approved. The preview now shows this task as testing.':state.entity==='theme'&&state.reviewResolved?'The fallback review thread is marked addressed. The branch remains available for your history instructions.':e.intro;return `<div class="message"><div class="by"><span>${esc(e.provider)} · ${esc(e.name)}</span><span>12:42</span></div><p>${esc(intro)}</p><div class="context-card">${esc(state.entity==='theme'&&state.reviewResolved?'PR #42 · review addressed':state.entity==='toolbar'&&state.approval?'Browser test · approved':e.context)}<p>${esc(e.detail)}</p></div></div>`;}
function chat(){const e=entities[state.entity];const own=state.messages[state.entity]||[];return `<section class="conversation" aria-label="Conversation with ${esc(e.name)}"><header class="chat-header"><div class="between"><span class="eyebrow">Direct conversation</span>${button(icon(state.paused[state.entity]?'play':'pause'),`data-action="pause" aria-label="${state.paused[state.entity]?'Resume':'Pause'} ${esc(e.name)}"`)}</div><div class="row" style="margin-top:9px"><span class="avatar">${icon(e.role.includes('coordinator')||state.entity==='project'?'orbit':'sparkles')}</span><div><h3>${esc(e.name)}</h3><div class="small subtle">${esc(e.provider)} · ${esc(status(state.entity))}</div></div></div></header><div class="messages">${seedMessage()}${own.map(m=>`<div class="message human"><div class="by"><span>You</span><span>Now</span></div><p>${esc(m)}</p><div class="receipt">Queued for ${esc(e.name)} · demo</div></div>`).join('')}</div><div class="suggestions">${button('Summarize progress','data-prompt="Summarize progress and the next blocker."')}${button('Next step','data-prompt="What is the next useful action for this task?"')}</div><form class="compose" data-chat-form><label for="celadon-draft">Message ${esc(e.name)}</label><textarea id="celadon-draft" placeholder="Give direction…" aria-label="Message ${esc(e.name)}">${esc(state.drafts[state.entity]||'')}</textarea><div class="between"><span class="small subtle">${state.paused[state.entity]?'Held while paused':'Direct to this agent'}</span>${button(`Send ${icon('arrow-up-right')}`,'data-action="send"','accent')}</div></form><div class="chat-bottom">${state.entity==='project'?'Project scope · no Git workspace':'Instructions are visible to the owning coordinator'}</div></section>`;}
function mapNode(key,extra=''){const e=entities[key];return button(`<span class="node-top"><span class="name">${esc(e.name)}</span><span class="provider">${esc(e.provider)}</span></span><span class="meta"><span class="signal ${status(key)==='Needs approval'?'wait':''}"></span>${esc(status(key))}</span>`,`data-agent="${key}"`,`node ${extra}`);}
function projectOverview(){return `<div class="view-head between"><div><h2>Work in motion</h2><p>Ownership, handoffs, and integration.</p></div><span class="tag">${Object.keys(entities).length} agents</span></div><div class="map" aria-label="Project orchestrator delegates to repository coordinators and workers"><div class="map-root">${mapNode('project')}</div><div class="map-branches"><div class="branch-col">${mapNode('chrome')}<div class="map-worker">${mapNode('theme')}</div><div class="map-worker feature">${mapNode('feature')}<div class="feature-child">${mapNode('toolbar')}</div></div>${state.newEntities.map(k=>entities[k].repo==='Google-Chrome'?`<div class="map-worker">${mapNode(k)}</div>`:'').join('')}</div><div class="branch-col">${mapNode('paletteRepo')}<div class="map-worker">${mapNode('palette')}</div>${state.newEntities.map(k=>entities[k].repo==='Celadon-Theme'?`<div class="map-worker">${mapNode(k)}</div>`:'').join('')}<div class="context-card" style="margin-top:24px">Shared token contract<p>palette-update → Google-Chrome</p></div></div></div><div class="map-foot"><span class="row">${icon('git-merge')} Worker PRs → feature → main</span><span>Studio · Linux</span></div></div><div class="attention-strip">${icon('circle-alert')}<div class="copy">${state.approval?'Browser test approved':'Toolbar test needs approval'}<p>${state.approval?'toolbar-styling can continue on Studio.':'toolbar-styling · Studio · browser integration'}</p></div>${button(state.approval?'Open':'Review',`data-action="${state.approval?'open-toolbar':'approval'}"`)}</div><div class="feed"><div class="eyebrow">Latest handoffs</div><div class="feed-row"><time>12:42</time><div>theme-init → Google-Chrome<p>PR #42 ready for review · 3 commits</p></div></div><div class="feed-row"><time>12:38</time><div>palette-update → Celadon<p>Four variants share the same role names</p></div></div></div>`;}
function repositoryBranches(){const keys=descendants(state.entity).filter(k=>k!==state.entity&&entities[k].branch);return `<div class="view-head"><h2>${state.view==='changes'?'Workspaces with changes':'Repository branches'}</h2><p>${esc(entities[state.entity].repo)} · base: origin/main</p></div>${keys.map(k=>button(`<span>${esc(entities[k].branch)}<small>${esc(entities[k].role)} · ${entities[k].pr?'PR #'+entities[k].pr:'no PR yet'}</small></span>${icon('git-branch')}`,`data-agent="${k}" data-next="${state.view}"`,'repo-pick')).join('')}`;}
function overview(){if(state.entity==='project')return projectOverview();const e=entities[state.entity];return `<div class="view-head"><h2>Assignment</h2><p>${esc(e.role)} · ${esc(status(state.entity))}</p></div><div class="brain-summary"><div class="eyebrow">Current goal</div><h2>${esc(e.name)}</h2><p>${esc(e.description)}</p></div><div class="eyebrow" style="margin-bottom:10px">Owner</div>${mapNode(e.parent)}${childKeys(state.entity).length?`<div class="eyebrow" style="margin:20px 0 10px">Delegated work</div>${childKeys(state.entity).map(k=>`<div style="margin-top:8px">${mapNode(k)}</div>`).join('')}`:`<div class="context-card" style="margin:22px 0">${esc(e.context)}<p>${esc(e.detail)}</p></div>`}<div class="row" style="margin-top:20px">${button('Inspect Git history','data-view="git"','outline')}${button('View pull requests','data-view="pr"','outline')}</div>`;}
function repoChooser(label){return `<div class="view-head"><h2>${label}</h2><p>Choose a repository or worker. The project orchestrator has no branch.</p></div>${['chrome','paletteRepo'].map(k=>button(`<span>${esc(entities[k].name)}<small>origin/main · ${k==='chrome'?'3 pull requests':'1 pull request'}</small></span>${icon('arrow-up-right')}`,`data-agent="${k}" data-next="${state.view}"`,'repo-pick')).join('')}`;}
function gitView(){if(state.entity==='project')return repoChooser('Repository history');if(['chrome','paletteRepo'].includes(state.entity))return repositoryBranches();if(state.newEntities.includes(state.entity))return `<div class="view-head"><h2>Branch history</h2><p>${esc(entities[state.entity].branch)} · new workspace</p></div><div class="brain-summary"><h3>No commits yet</h3><p>The task is ready for its first instruction.</p></div>`;const e=entities[state.entity];const selected=state.selected.length;return `<div class="view-head between"><h2>Branch history</h2><span class="tag">Fetched 40s ago</span></div><div class="branch-summary"><div class="between"><span class="row mono">${icon('git-branch')}${esc(e.branch||'new task')}</span>${button('Prepare rebase','data-action="rebase"')}</div><p><span class="green">3 ahead</span> · <span class="yellow">2 behind</span> ${state.entity==='toolbar'?'feature/theme-overhaul':'origin/main'}</p></div><div class="graph"><svg class="graph-svg" viewBox="0 0 58 324" aria-hidden="true"><path d="M16 4V319"/><path class="work-line" d="M40 4V245Q40 278 16 297"/></svg>${commits().map(([sha,title],i)=>button(`<span class="point"></span><span class="commit-copy"><strong>${esc(title)}</strong><small class="mono">${sha} · ${i<3?esc(e.name):i===3?(state.entity==='toolbar'?'feature/theme-overhaul':'origin/main'):i===5?'common ancestor':(state.entity==='toolbar'?'feature/theme-overhaul~1':'origin/main~1')}</small></span>`,`data-commit="${sha}" aria-pressed="${state.selected.includes(sha)}" aria-label="Select ${sha}: ${esc(title)}"`,`commit ${i>=3?'base':''}`)).join('')}</div><div class="selection-bar between"><span>${selected?`${selected} commit${selected===1?'':'s'} selected`:'Select commits to direct a history change'}</span>${button('Prepare squash','data-action="squash" '+(selected<2?'disabled':''),'outline')}</div><div class="notice">Instructions go to ${esc(e.name)} with the selected commit IDs.</div>`;}
function changesView(){if(state.entity==='project')return repoChooser('Changes across repositories');if(['chrome','paletteRepo'].includes(state.entity))return repositoryBranches();if(state.newEntities.includes(state.entity))return '<div class="view-head"><h2>Working changes</h2><p>No changes yet. Give the new task its first assignment.</p></div>';const e=entities[state.entity];return `<div class="view-head between"><div><h2>Working changes</h2><p>${esc(e.branch)} · 2 files</p></div><span class="mono"><span class="green">+28</span> <span class="red">−12</span></span></div><details class="diff-file" open><summary>src/theme/tokens.ts <span class="subtle">· +18 −8</span></summary><div class="code-row">  export const toolbar = {</div><div class="code-row del">−   background: '#1B2632',</div><div class="code-row add">+   background: palette.surface,</div><div class="code-row del">−   foreground: '#EEE9DF',</div><div class="code-row add">+   foreground: palette.text,</div><div class="code-row add">+   focus: palette.green,</div><div class="code-row">  };</div></details><details class="diff-file"><summary>tests/theme.test.ts <span class="subtle">· +10 −4</span></summary><div class="code-row add">+ for (const variant of variants) {</div><div class="code-row add">+   expect(tokens(variant)).toHaveRole('focus');</div><div class="code-row add">+ }</div></details>${button('Ask agent to review these changes','data-prompt="Review the current diff for hardcoded colors and missing semantic roles."','outline')}`;}
function prView(){if(state.newEntities.includes(state.entity))return '<div class="view-head"><h2>Pull requests</h2><p>No pull request yet.</p></div>';if(state.entity==='project'||state.entity==='chrome'||state.entity==='paletteRepo'){const keys=descendants(state.entity).filter(k=>entities[k].pr);return `<div class="view-head"><h2>Pull requests</h2><p>Review state follows the current branch head.</p></div>${keys.map(k=>button(`<span>#${entities[k].pr} · ${esc(entities[k].name)}<small>${esc(entities[k].repo)} · ${esc(status(k))}</small></span>${icon('arrow-up-right')}`,`data-agent="${k}" data-next="pr"`,'repo-pick')).join('')}`;}const e=entities[state.entity];return `<div class="view-head"><div class="between"><h2>Pull request #${e.pr||'—'}</h2><span class="tag">${esc(status(state.entity))}</span></div><p>${esc(e.branch)} → ${state.entity==='toolbar'?'feature/theme-overhaul':'main'}</p></div><div class="check-row"><span class="row">${icon('circle-check')} Typecheck</span><span class="green">Passed</span></div><div class="check-row"><span class="row">${icon('circle-check')} Unit tests</span><span class="green">Passed · 42 tests</span></div><div class="check-row"><span class="row">${icon('monitor')} Browser test</span><span class="${state.entity==='toolbar'&&!state.approval?'yellow':'green'}">${state.entity==='toolbar'?(state.approval?'Queued':'Needs approval'):'Passed'}</span></div>${state.entity==='toolbar'&&!state.approval?button('Review test permission','data-action="approval"','outline'):''}<div class="review"><div class="between"><span class="row">${icon('message-square')} ${state.entity==='theme'?'Review thread':'Integration note'}</span><span class="tag">${state.reviewResolved&&state.entity==='theme'?'Addressed':'Open'}</span></div><p>${state.entity==='theme'?'Could the fallback use the semantic surface role? A fixed color breaks the Sky variant.':'Keep the shared palette contract intact and run combined checks before integration.'}</p><div class="row">${button( function activity(){if(state.newEntities.includes(state.entity))return '<div class="view-head"><h2>Activity</h2><p>New task created in this prototype. Waiting for its first instruction.</p></div>';return `<div class="view-head"><h2>Activity</h2><p>${esc(entities[state.entity].name)} · messages, operations and handoffs</p></div>${[['12:42','Review requested','theme-init reported PR #42 ready.'],['12:41','Git fetched','Base changes detected. Two commits behind origin/main.'],['12:39','Approval requested','toolbar-styling needs a browser test on Studio.'],['12:38','Work log recorded','palette-update captured the shared export contract.'],['12:30','Assignment accepted','Codex accepted the theme-init work order.']].map(([t,h,p])=>`<div class="feed-row"><time>${t}</time><div>${h}<p>${p}</p></div></div>`).join('')}`;}

function brainView(){return `<div class="view-head between"><h2>Project brain</h2><span class="tag">celadon-docs</span></div><div class="brain-summary"><div class="eyebrow">STATUS.md</div><h2>What this project knows.</h2><p>The theme contract is shared. Chrome is integrating. ${state.compiled?'The latest work logs have been compiled.':'Two new work logs are waiting to become knowledge.'}</p></div><div class="between" style="margin-bottom:8px"><span class="eyebrow">Wiki · 3 notes</span>${button('Work logs','data-action="logs"','quiet')}</div>${notes.map((n,i)=>button(`<span class="note-name">${icon('file-text')}${n[0]}</span><p>${n[1]}</p>`,`data-note="${i}"`,'note')).join('')}<div class="attention-strip">${icon('git-pull-request')}<div class="copy">${state.decisionResolved?'Decision reconciled':'One decision needs a ruling'}<p>${state.decisionResolved?'The generated role names remain authoritative.':'Two logs disagree about the fallback role.'}</p></div>${button(state.decisionResolved?'View':'Resolve','data-action="conflict"')}</div>${button('Compile pending logs','data-run="compile" '+(state.compiled?'disabled':''),'outline')}<div class="notice">Last compilation: ${state.compiled?'just now':'yesterday at 23:00'} · sources preserved</div>`;}

function scheduleView(){return `<div class="view-head"><div class="between"><h2>Scheduled work</h2><span class="tag">America/New_York</span></div><p>The host keeps time. Agents wake only when there is work.</p></div>${jobs.map(j=>`<article class="job"><div class="between"><h3 class="row">${icon(j.icon)}${j.name}</h3><span class="tag">${state.jobsPaused[j.id]?'Paused':j.time}</span></div><p>${j.desc}</p><div class="row">${button('Run now',`data-run="${j.id}" ${state.jobsPaused[j.id]?'disabled':''}`,'outline')}${button(state.jobsPaused[j.id]?'Resume':'Pause',`data-job-pause="${j.id}"`)}${button('Run history',`data-job-history="${j.id}"`,'quiet')}</div><div class="last-run">${state.jobRuns[j.id]||'Last run: yesterday · completed'}</div></article>`).join('')}`;}
function usageView(){const t=totals(state.entity);if(!t.input&&!t.output)return `<div class="view-head"><h2>Usage</h2><p>${esc(entities[state.entity].name)} · no model turns yet</p></div><div class="usage-totals"><div><p>Input tokens</p><div class="total">0</div></div><div><p>Output tokens</p><div class="total">0</div></div></div><div class="notice">Usage will appear after this task starts a turn.</div>${capacity()}`;const weights=[.12,.17,.15,.26,.16,.08,.06];const inputs=weights.map(w=>Math.round(t.input*w));const outputs=weights.map(w=>Math.round(t.output*w));inputs[6]+=t.input-inputs.reduce((a,b)=>a+b,0);outputs[6]+=t.output-outputs.reduce((a,b)=>a+b,0);const max=Math.max(...inputs.map((n,i)=>n+outputs[i]));const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];return `<div class="view-head"><div class="between"><h2>Usage</h2><span class="tag">Sample week</span></div><p>${esc(entities[state.entity].name)} · ${descendants(state.entity).length} sessions</p></div><div class="usage-totals"><div><p>Input tokens</p><div class="total">${t.input.toLocaleString()}</div></div><div><p>Output tokens</p><div class="total">${t.output.toLocaleString()}</div></div></div><div class="eyebrow" style="margin-bottom:13px">Tokens by day</div><div class="bars" aria-label="Input and output tokens by weekday">${names.map((n,i)=>button(`<span class="stack" style="height:${(inputs[i]+outputs[i])/max*112}px"><span class="in" style="height:${inputs[i]/(inputs[i]+outputs[i]||1)*100}%"></span><span class="out" style="height:${outputs[i]/(inputs[i]+outputs[i]||1)*100}%"></span></span><span class="dayname">${n}</span>`,`data-day="${i}" aria-pressed="${state.day===i}" aria-label="${n}: ${inputs[i]} input and ${outputs[i]} output tokens"`,'day')).join('')}</div><div class="day-detail">${names[state.day]} · ${inputs[state.day].toLocaleString()} in / ${outputs[state.day].toLocaleString()} out${state.day===3?' · highest usage':''}</div><div class="legend"><span><i class="swatch"></i>Input</span><span><i class="swatch blue"></i>Output</span></div><div class="eyebrow">Account capacity</div>${capacity()}<div class="notice">Account limits are shared across tasks. Tokens above are scoped to this selection.</div>`;}
function capacity(){return `<div class="capacity-row"><div class="between"><span>Codex</span><span class="green">32% remaining</span></div><div class="meter" role="progressbar" aria-label="Codex capacity remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="32"><span style="width:32%"></span></div><p>5-hour window · resets in 2h 10m · sample reading</p></div><div class="capacity-row"><div class="between"><span>Claude</span><span class="subtle">Quota unavailable</span></div><p>Token totals are available. No account percentage was reported.</p></div>`;}
function render(){applyTheme();const e=entities[state.entity];const special=['brain','schedule','usage'].includes(state.view);const headings={brain:['PROJECT MEMORY','A second brain.','Decisions and evidence that outlive any one session.'],schedule:['AUTONOMY','While you’re away.','Scheduled work, clear ownership, and a visible paper trail.'],usage:['CAPACITY','Know where it goes.','Model usage across the work you are coordinating.']};const h=special?headings[state.view]:[e.role.toUpperCase(),state.entity==='project'?'Theme rollout':e.name,e.description];root.innerHTML=`<div class="window"><header class="titlebar"><div class="brand"><span class="brandmark">${icon('sprout')}</span><span>Celadon <span class="slash">/</span> Studio</span><span class="small subtle study-label">Interactive study</span></div><div class="row">${button(`<span class="theme-chip"></span>${themeNames[state.theme]}`,'data-action="appearance" aria-label="Change appearance"')}${button(`${icon('gauge')} 32% Codex`,'data-action="capacity"')}${button(`${icon('bell')} ${(!state.approval?1:0)+(!state.decisionResolved?1:0)}`,'data-action="attention" aria-label="Open attention inbox"')}</div></header><div class="app"><aside class="sidebar"><nav class="nav" aria-label="Workspace destinations">${[['overview','orbit','Workspace'],['brain','book-open','Brain'],['schedule','clock-3','Scheduled'],['usage','chart-no-axes-column','Usage']].map(([v,i,n])=>button(`${icon(i)}${n}`,`data-view="${v}"`,state.view===v?'active':'')).join('')}</nav><div class="tree-wrap"><div class="section-label eyebrow">Projects</div><nav class="tree" aria-label="Agent hierarchy">${tree()}</nav>${button(`${icon('plus')} New task`,'data-action="new"','new-work')}</div><div class="host">${button(`<span class="signal"></span>Studio ${icon('arrow-up-right')}`,'data-action="host"')}<p>Linux · headless<br>Connected · all work saved</p></div></aside><main class="workarea" style="${design.atmosphere?'':'background:var(--base)'}"><header class="heading between"><div><div class="scope-breadcrumb">${breadcrumb()}</div><div class="eyebrow" style="margin-top:16px">${h[0]}</div><h1>${esc(h[1])}</h1><p class="description">${esc(h[2])}</p></div><div class="heading-actions">${!special&&state.entity==='project'?`<button type="button" class="project-cover cursor-interaction" data-action="appearance" aria-label="Explore Celadon appearance"><span class="glaze" aria-hidden="true"></span><span class="cover-caption">CELADON<span>THE PALETTE FAMILY</span></span></button>`:button(`${icon('plus')} New task`,'data-action="new"','outline')}</div></header><div class="workgrid"><section class="canvas" aria-label="Workspace detail">${!special?`<nav class="tabs" aria-label="Task views">${allTabs.map(([v,n])=>button(n,`data-view="${v}" aria-selected="${state.view===v}"`)).join('')}</nav>`:''}<div class="view">${({overview,git:gitView,changes:changesView,pr:prView,activity,brain:brainView,schedule:scheduleView,usage:usageView}[state.view]||overview)()}</div></section>${chat()}</div><footer class="statusbar"><span class="row"><span class="signal"></span>Studio connected · fetched 40s ago</span><span>Simulated sessions · Celadon theme</span></footer><div class="notice" role="status" aria-live="polite">${esc(state.notice)}</div></main></div><div class="sheet-host"></div></div>`;if(state.sheet)renderSheet();icons();}

function renderSheet(){if(!state.sheet)return;const {kind,value}=state.sheet;let content='';if(kind==='appearance'){content=sheet('Celadon, in four lights.',`<p class="subtle small" style="margin-bottom:16px">The published Celadon palette family.</p><div class="theme-grid">${Object.entries(palettes).map(([k,p])=>button(`<span class="theme-colors">${['base','surface','green','blue'].map(t=>`<i style="background:${p.palette[t]}"></i>`).join('')}</span>${themeNames[k]}<small>${k==='celadon-sky'?'Light · sage paper':k==='celadon-jade'?'Dark · high contrast':k==='celadon-powder'?'Dark · low contrast':'Dark · balanced'}</small>`,`data-theme="${k}" aria-pressed="${state.theme===k}"`,'theme-choice')).join('')}</div><div style="margin-top:14px">${button('Follow system appearance',`data-theme="system" aria-pressed="${state.theme==='system'}"`,'outline')}</div><p class="notice">System uses Celadon for dark appearance and Sky for light. Your draft and selected commits stay in place.</p>`);}else if(kind==='capacity'){content=sheet('Provider capacity',capacity()+`<div class="notice">Sample account readings. Choose Usage to explore tokens by task and weekday.</div>`,button('Open usage','data-open-usage','accent'));}else if(kind==='approval'){content=sheet('Run browser integration test?',`<p class="subtle small">toolbar-styling · Codex · Studio</p><div class="detail-box"><p>Launch a browser test process for the toolbar changes.</p><p class="mono">pnpm test:browser</p><p class="small subtle">Google-Chrome / toolbar-styling<br>Execution host: Studio · Linux</p></div><p class="small subtle">Approval applies to this operation. This preview changes local demo state only.</p>`,button('Keep waiting','data-close')+button(state.approval?'Already approved':'Approve test',`data-approve ${state.approval?'disabled':''}`,'accent'));}else if(kind==='attention'){content=sheet('Needs your attention',`${!state.approval?`<div class="check-row"><span>Browser test · toolbar-styling</span>${button('Review','data-action="approval"','outline')}</div>`:''}${!state.decisionResolved?`<div class="check-row"><span>Conflicting fallback decision</span>${button('Resolve','data-action="conflict"','outline')}</div>`:''}${state.approval&&state.decisionResolved?'<p class="subtle">Nothing waiting for a decision.</p>':''}`);}else if(kind==='new'){content=sheet('Start a task',`<form data-new-form><label class="field">Task name<input name="task" required pattern=".*\\S.*" maxlength="48" placeholder="e.g. sky-contrast-audit"></label><label class="field">Repository<select name="repo"><option value="chrome">Google-Chrome</option><option value="paletteRepo">Celadon-Theme</option></select></label><label class="field">Provider<select name="provider"><option>Codex</option><option>Claude</option></select></label><div class="small subtle">The new worker gets a branch, its own conversation, and an owner.</div><div class="actions">${button('Cancel','data-close')}${button('Create task','data-create','accent')}</div></form>`);}else if(kind==='squash'||kind==='rebase'){const e=entities[state.entity];content=sheet(kind==='squash'?'Prepare a squash instruction':'Prepare a rebase instruction',`<p class="subtle small">${esc(e.repo)} · ${esc(e.name)}</p><div class="detail-box"><p class="mono">${esc(e.branch)} → ${state.entity==='toolbar'?'feature/theme-overhaul':'origin/main'}</p>${kind==='squash'?`<p>${state.selected.length} selected commits</p><p class="mono">${state.selected.map(esc).join(' · ')}</p>`:'<p>Fetch the target branch, inspect conflicts, then propose the history update.</p>'}</div><p class="small subtle">The agent will inspect the affected refs before changing published history.</p>`,button('Cancel','data-close')+button('Put in conversation',`data-prepare="${kind}"`,'accent'));}else if(kind==='note'){const n=notes[value];content=sheet(n[0],`<span class="tag">Decision</span><div class="detail-box"><p>${n[2]}</p></div><p class="small subtle">Source: second-brain/logs/${value===0?'celadon-theme':'celadon-docs'}.md<br>Updated: October 2, 2026 · verified sample evidence</p>`,button('Show source logs','data-action="logs"','outline')+button('Discuss with orchestrator',`data-discuss-note="${value}"`,'accent'));}else if(kind==='logs'){content=sheet('Recent work logs',`<div class="eyebrow">second-brain/logs/celadon-theme.md</div><div class="detail-box"><h3>Align generated palette roles</h3><p class="mono">type: decision<br>ref: palette-update @ c6d91f0 · PR #18</p><p>Changed: all four variants export the same semantic roles.</p><p>Why: consumers should not invent their own palette.</p><p>State: Chrome is integrating the generated roles.</p></div><p class="small subtle">${state.compiled?'Compiled into Theme token contract.':'Pending compilation · 2 new entries.'}</p>`);}else if(kind==='conflict'){content=sheet('Reconcile a decision',`<span class="tag">${state.decisionResolved?'Resolved':'Decision contradiction'}</span><div class="detail-box"><h3>Which role is the fallback?</h3><p><span class="green">Established decision:</span> use palette.surface.</p><p><span class="yellow">New log:</span> use a fixed background color.</p></div><p class="small subtle">Keep the generated semantic role so Sky and the dark variants can share the component.</p>`,button('Review later','data-close')+button('Keep semantic role',`data-resolve-decision ${state.decisionResolved?'disabled':''}`,'accent'));}else if(kind==='history'){const j=jobs.find(j=>j.id===value);content=sheet(j.name+' history',`<div class="check-row"><span>Latest run</span><span>${state.jobRuns[value]||'Yesterday · completed'}</span></div><div class="notice">Owner: Celadon · host: Studio<br>Procedure version: 1 · retry: bounded<br>Scheduled work is simulated in this study.</div>`);}else if(kind==='host'){content=sheet('Studio',`<div class="row"><span class="signal"></span>Connected · Linux headless host</div><div class="detail-box"><p>Provider sessions and Git workspaces live here.</p><p>Closing this interface keeps eligible work running. Approvals wait until you return.</p></div><div class="check-row"><span>Connection</span><span>Encrypted · sample</span></div><div class="check-row"><span>Last event</span><span>3 seconds ago</span></div>`);}root.querySelector('.sheet-host').innerHTML=content;}

root.addEventListener('submit',event=>{event.preventDefault();if(event.target.matches('[data-chat-form]'))send();if(event.target.matches('[data-new-form]'))root.querySelector('[data-create]')?.click();});
function send(){const text=(state.drafts[state.entity]||'').trim();if(!text){root.querySelector('textarea').focus();return;}(state.messages[state.entity]??=[]).push(text);state.drafts[state.entity]='';state.notice=`Instruction queued for ${entities[state.entity].name}. This is a local simulation.`;render();remember();}
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-close')){event.preventDefault();closeSheet();return;}if(b.dataset.agent){navigate(b.dataset.agent,b.dataset.next);return;}if(b.dataset.view){state.view=b.dataset.view;state.notice='';render();remember();return;}if(b.dataset.commit){const sha=b.dataset.commit;state.selected=state.selected.includes(sha)?state.selected.filter(x=>x!==sha):[...state.selected,sha];render();remember();return;}if(b.dataset.prompt){setDraft(b.dataset.prompt);return;}if(b.dataset.theme){state.theme=b.dataset.theme;render();remember();return;}if(b.dataset.day){state.day=Number(b.dataset.day);render();return;}if(b.dataset.run){runJob(b.dataset.run);return;}if(b.dataset.jobPause){const id=b.dataset.jobPause;state.jobsPaused[id]=!state.jobsPaused[id];render();return;}if(b.dataset.jobHistory){openSheet('history',b.dataset.jobHistory);return;}if(b.dataset.note){openSheet('note',Number(b.dataset.note));return;}if(b.hasAttribute('data-approve')){state.approval=true;state.notice='Browser test approved in the demo. toolbar-styling can continue.';state.sheet=null;render();return;}if(b.hasAttribute('data-resolve-decision')){state.decisionResolved=true;state.sheet=null;state.notice='Decision recorded: keep the semantic surface role.';render();return;}if(b.hasAttribute('data-open-usage')){state.view='usage';state.sheet=null;render();return;}if(b.dataset.prepare){const ids=state.selected.join(', ');setDraft(b.dataset.prepare==='squash'?`Inspect commits ${ids} on ${entities[state.entity].branch}. Propose a squash preserving the intended changes, then explain any effect on the PR and downstream branches before rewriting published history.`:`Fetch ${state.entity==='toolbar'?'feature/theme-overhaul':'origin/main'} and inspect the rebase of ${entities[state.entity].branch}. Explain conflicts and affected PRs before changing published history.`);return;}if(b.hasAttribute('data-discuss-note')){const n=notes[Number(b.dataset.discussNote)];state.entity='project';setDraft(`Review the decision “${n[0]}” and explain how it affects the current work.`);return;}if(b.hasAttribute('data-create')){event.preventDefault();const f=root.querySelector('[data-new-form]');if(!f.reportValidity())return;const data=new FormData(f);const name=String(data.get('task')).trim();if(!name)return;const parent=String(data.get('repo'));const key='task'+Date.now();entities[key]={name,role:'Implementation worker',provider:String(data.get('provider')),parent,repo:entities[parent].repo,branch:name.toLowerCase().replace(/[^a-z0-9-]+/g,'-'),status:'Ready',ownIn:0,ownOut:0,description:'A new scoped task, ready for instructions.',intro:'This worker is ready for its first assignment in the prototype.',context:'New task · '+entities[parent].name,detail:'Give this agent a bounded goal to begin.'};state.newEntities.push(key);state.sheet=null;navigate(key,'activity');return;}const a=b.dataset.action;if(a==='send'){event.preventDefault();send();}else if(a==='pause'){state.paused[state.entity]=!state.paused[state.entity];render();}else if(a==='open-toolbar'){navigate('toolbar','pr');}else if(a==='review-prompt'){setDraft('Address the PR feedback about the fallback role. Use the semantic surface token, validate Sky and the dark variants, and report the resulting commit.');}else if(a==='resolve-review'){state.reviewResolved=!state.reviewResolved;render();}else if(['appearance','capacity','attention','approval','new','host','logs','conflict','squash','rebase'].includes(a)){openSheet(a);}});
root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.sheet){closeSheet();return;}if((event.metaKey||event.ctrlKey)&&event.key==='Enter'&&event.target.matches('textarea')){event.preventDefault();send();}if(event.key==='Tab'&&state.sheet){const controls=[...root.querySelectorAll('.sheet button:not(:disabled),.sheet input,.sheet select,.sheet textarea')];const first=controls[0],last=controls.at(-1);if(event.shiftKey&&event.target===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&event.target===last){event.preventDefault();first?.focus();}}});
window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState;if(!next)return;const m=next.modelContent||{},p=next.privateContent||{};if(entities[m.agent])state.entity=m.agent;if(['overview','git','changes','pr','brain','schedule','usage','activity'].includes(m.view))state.view=m.view;if(palettes[m.theme]||m.theme==='system')state.theme=m.theme;if(p.drafts&&typeof p.drafts==='object')state.drafts=p.drafts;if(Array.isArray(p.selected))state.selected=p.selected.filter(x=>typeof x==='string');render();});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(state.theme==='system')applyTheme();});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'atmosphere',{label:'Ambient color'});tweak.addSlider(design,'radius',{label:'Window corner radius',min:4,max:24,unit:'px'});tweak.addSlider(design,'spacing',{label:'Workspace spacing',min:14,max:24,unit:'px'});}
})();
</script>
