project:{name:'Celadon',role:'Project orchestrator',provider:'Claude',state:'Coordinating',branch:null,description:'A quieter browser theme, consistent across Chrome and the shared palette.',message:'Chrome and the shared palette are moving together. Theme-init is ready for your review; toolbar work is waiting for the token update.',handoff:'Google-Chrome → Celadon · review requested'},
repo:{name:'Google-Chrome',role:'Repository coordinator',provider:'Claude',state:'Coordinating',branch:'origin/main',description:'Owns integration, review order, and branch freshness.',message:'Theme-init is based on the current main. I am holding toolbar integration until the theme token changes land.',handoff:'theme-init → Google-Chrome · ready for review'},
theme:{name:'theme-init',role:'Implementation worker',provider:'Codex',state:'Review requested',branch:'theme-init',description:'Initialize theme tokens and remove hardcoded toolbar colors.',message:'The token migration is ready. Two small fix commits can be folded into the initial change. The PR has one unresolved reviewer question.',handoff:'theme-init → Google-Chrome · PR #42 ready for review'},

}

function drawHistory(s){if(s.entity==='project')return `<div class="label">Project integration</div><div class="notice">The project orchestrator has no Git branch. Select a repository, feature, or worker to inspect its history.</div><div class="checkrow"><span>Google-Chrome</span><button class="cursor-interaction" data-select="repo">Inspect history →</button></div><div class="checkrow"><span>Celadon-Theme</span><button class="cursor-interaction" data-select="palette">Inspect history →</button></div>`;
const branch=s.entity==='repo'?'theme-init':s.entity==='paletteRepo'?'palette-update':entities[s.entity].branch;const target=s.entity==='toolbar'?'feature/theme-overhaul':'origin/main';
return `<div class="branchmeta row"><span class="pill">${escape(branch)}</span><span class="tiny muted">→ ${target}</span><span class="tiny muted">3 ahead · 0 behind</span></div><div class="graphrows" aria-label="Commit ancestry; worker commits branch from origin/main"><svg class="graphlines" viewBox="0 0 64 288" role="img" aria-label="Three worker commits branching from three main commits"><path d="M18 168 L18 264"/><path class="worker-line" d="M48 24 L48 120 Q48 144 18 168"/></svg>${scopedCommits(s).map((c,i)=>`<button class="commit cursor-interaction" data-commit="${c.sha}" aria-pressed="${s.selected.has(c.sha)}" aria-label="Select ${escape(c.name)}, ${c.sha}"><span class="commitmark ${c.worker?'':'base'}"></span><span class="committext"><span class="commitname">${escape(c.name)}</span><span class="commitdetail">${c.sha} · ${escape(c.detail)}</span></span></button>`).join('')}</div><div class="selectedbar spread"><span>${s.selected.size?`${s.selected.size} commits selected`:'Select commits to give an instruction'}</span>${s.selected.size?'<button class="cursor-interaction" data-prepare>Prepare squash instruction</button>':''}</div><div class="tiny muted">Fresh base · watcher will check again in 2 minutes</div>`;}
function prInfo(s){if(s.entity==='palette'||s.entity==='paletteRepo')return {id:18,title:'Align shared palette exports',branch:'palette-update',base:'main',head:'c6d91f0',status:'Draft',comment:'Please confirm that the exported token names match the Chrome contract.'};if(s.entity==='toolbar')return {id:44,title:'Apply theme tokens to the toolbar',branch:'toolbar-styling',base:'feature/theme-overhaul',head:'c6d91f0',status:'Open',comment:'Check the inactive toolbar foreground in the browser test.'};if(s.entity==='feature')return {id:47,title:'Integrate browser theme overhaul',branch:'feature/theme-overhaul',base:'main',head:'c6d91f0',status:'Draft',comment:'Run the combined suite after all worker PRs are integrated.'};return {id:42,title:'Initialize semantic theme tokens',branch:'theme-init',base:'main',head:'0b57a9e',status:'Open',comment:'Can we use the semantic foreground token here? The fallback looks too dark in the inactive toolbar.'};}
function drawPR(s){if(s.entity==='project')return `<div class="label">Project pull requests</div><div class="checkrow"><span>Chrome token migration · #42</span><button class="cursor-interaction" data-select="theme">Review requested →</button></div><div class="checkrow"><span>Shared palette · #18</span><button class="cursor-interaction" data-select="palette">Draft →</button></div>`;
const pr=prInfo(s);return `<div class="spread"><h3>#${pr.id} ${pr.title}</h3><span class="pill">${pr.status}</span></div><div class="small muted" style="margin:7px 0 17px">${pr.branch} → ${pr.base} · checks for ${pr.head}</div><div class="checkrow"><span>Unit tests</span><span class="statustext">Passed</span></div><div class="checkrow"><span>Type checking</span><span class="statustext">Passed</span></div><div class="checkrow"><span>Browser integration</span><span class="muted">${s.entity==='toolbar'&&!s.approved?'Waiting for approval':'Running'}</span></div><div class="reviewcomment"><div class="small">Alex · reviewer <span class="muted">12 minutes ago</span></div><p>${pr.comment}</p><div class="row"><button class="cursor-interaction" data-address>Ask agent to address</button><span class="tiny muted">Unresolved</span></div></div>`;}
const days=[{day:'Mon',input:24,output:5},{day:'Tue',input:46,output:9},{day:'Wed',input:31,output:7},{day:'Thu',input:67,output:12},{day:'Fri',input:42,output:9},{day:'Sat',input:11,output:2},{day:'Sun',input:9,output:2}];
function drawUsage(s){const factor=s.entity==='project'?3:(s.entity==='repo'||s.entity==='paletteRepo')?2:1;const ins=days.reduce((a,b)=>a+b.input,0)*factor,outs=days.reduce((a,b)=>a+b.output,0)*factor;return `<div class="spread"><span class="label">${s.entity==='project'?'Project and descendants':'This agent'} · sample week</span><span class="tiny muted">Tokens, thousands</span></div><div class="tokenpair"><div><span class="tiny muted">Input tokens</span><b>${ins.toLocaleString()}k</b></div><div><span class="tiny muted">Output tokens</span><b>${outs.toLocaleString()}k</b></div></div><div class="usagebars" role="img" aria-label="Token totals by weekday in the sample week; Thursday has the highest use">${days.map(d=>`<div class="usageday"><div class="barstack" style="height:${(d.input+d.output)/79*100}%" data-tooltip="${d.day}: ${d.input*factor}k input, ${d.output*factor}k output"><div class="out" style="height:${d.output/(d.output+d.input)*100}%"></div><div class="in" style="height:${d.input/(d.output+d.input)*100}%"></div></div><div class="daylabel">${d.day}</div></div>`).join('')}</div><div class="usagekey"><span><i class="keymark"></i>Input</span><span><i class="keymark output"></i>Output</span></div><div class="notice">Thursday accounts for the most usage in this sample week.</div><div class="tiny muted">Recorded in this app · America/New_York<br>Account quota is separate from token totals.</div>`;}
function drawPane(s){const p=s.el.querySelector('[data-pane]');if(s.tab==='history')p.innerHTML=drawHistory(s);if(s.tab==='pr')p.innerHTML=drawPR(s);if(s.tab==='changes'&&s.entity==='project'){p.innerHTML='<div class=notice>The project orchestrator has no Git workspace. Select a repository or worker to inspect changes.</div>';return;}if(s.tab==='changes')p.innerHTML=`<div class="spread" style="margin-bottom:13px"><h3>toolbar.ts</h3><span class="tiny muted">+18 −6 · 3 files</span></div><div class="diffrow"><span class="lineno">41</span><span>const toolbarTheme = {</span></div><div class="diffrow add"><span class="lineno">42</span><span>foreground: tokens.foreground,</span></div><div class="diffrow add"><span class="lineno">43</span><span>background: tokens.surface,</span></div><div class="diffrow add"><span class="lineno">44</span><span>border: tokens.borderMuted,</span></div><div class="diffrow"><span class="lineno">45</span><span>};</span></div><div class="reviewcomment"><div class="tiny muted">Reviewer thread · line 42</div><p>Use the semantic foreground token for the inactive toolbar.</p><button class="cursor-interaction" data-address>Discuss with ${escape(entities[s.entity].name)}</button></div>`;if(s.tab==='usage')p.innerHTML=drawUsage(s);if(s.tab==='activity')p.innerHTML=`<div class="event"><span class="tiny muted">16:52</span><div>${escape(entities[s.entity].name)} reported status<div class="tiny muted">${escape(entities[s.entity].handoff)}</div></div></div><div class="event"><span class="tiny muted">16:49</span><div>${s.entity==='toolbar'?'Browser test requested':'Checks updated'}<div class="tiny muted">${s.entity==='project'?'Project PR summary':`PR #${prInfo(s).id} · head ${prInfo(s).head}`}</div></div></div><div class="event"><span class="tiny muted">16:46</span><div>Watcher fetched ${s.entity==='toolbar'?'feature/theme-overhaul':'origin/main'}<div class="tiny muted">Base unchanged · no model call</div></div></div><div class="event"><span class="tiny muted">16:42</span><div>Host checkpoint saved<div class="tiny muted">Studio · queued messages preserved</div></div></div>`;icons();}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function render(s){const e=s.entity==='toolbar'&&s.approved?{...entities.toolbar,state:'Test approved',message:'Approval is recorded. The browser integration test can now run on Studio; the prototype does not execute a real test.',handoff:'toolbar-styling → Theme overhaul · approval recorded'}:entities[s.entity];s.el.querySelectorAll('[data-select]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.select===s.entity)));s.el.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===s.tab)));s.el.querySelector('[data-evidence-title]').textContent=e.name;s.el.querySelector('[data-scope-meta]').textContent=`${e.role} · ${e.provider} · Studio`;s.el.querySelector('[data-state]').textContent=s.paused?'Paused':e.state;s.el.querySelector('[data-breadcrumb]').textContent=s.entity==='project'?'Project orchestrator':`Celadon / ${s.entity==='palette'||s.entity==='paletteRepo'?'Celadon-Theme':'Google-Chrome'}`;s.el.querySelector('[data-focus-title]').textContent=e.name;s.el.querySelector('[data-focus-description]').textContent=e.description;s.el.querySelector('[data-chat-title]').textContent=e.name;s.el.querySelector('[data-chat-role]').textContent=`${e.provider} · ${e.role.toLowerCase()}`;s.el.querySelector('[data-avatar]').textContent=e.provider==='Codex'?'Co':'Cl';s.el.querySelector('[data-compose-label]').textContent=`Message ${e.name}`;s.el.querySelector('[data-tab=pr]').innerHTML=s.entity==='project'?'PRs':'PR <span class=muted>1</span>';s.el.querySelector('[data-pause]').setAttribute('aria-label',s.paused?'Resume selected agent':'Pause selected agent');s.el.querySelector('[data-pause]').innerHTML=icon(s.paused?'play':'pause');s.el.querySelector('[data-chats]').innerHTML=`<div class="message"><div class="speaker">${escape(e.name)} <span>· ${e.provider}</span></div><p>${escape(e.message)}</p><div class="handoff">${escape(e.handoff)}</div></div><div class="message human"><div class="speaker">Michael</div><p>${s.entity==='toolbar'?'Keep the worktree intact while the test waits.':'Keep the history readable. Show me the fixes before squashing.'}</p><div class="receipt">Acknowledged · this session</div></div>${s.sent.filter(m=>m.entity===s.entity).map(m=>`<div class="message human"><div class="speaker">Michael</div><p>${escape(m.text)}</p><div class="receipt">Queued · prototype only</div></div>`).join('')}`;drawPane(s);icons();}
function tell(s,text){s.el.querySelector('[data-live]').textContent=text;}
function sheet(s,type){const panel=s.el.querySelector('[data-sheet-panel]');panel.hidden=false;const close=`<button class="cursor-interaction" data-close aria-label="Close inspector">${icon('x')}</button>`;if(type==='capacity')panel.innerHTML=`<div class="spread"><h2>Provider capacity</h2>${close}</div><div class="checkrow"><span>Codex · account window</span><span>68% used · 32% remaining</span></div><p class="small muted" style="margin-top:8px">Sample 5-hour window · resets in 2h 10m</p><div class="checkrow"><span>Claude · account quota</span><span>Unavailable</span></div><p class="small muted" style="margin-top:8px">Token usage is recorded. This sample has no supported Claude quota reading.</p><div class="notice">Account capacity is shared across tasks and hosts.</div>`;if(type==='host')panel.innerHTML=`<div class="spread"><h2>Studio execution host</h2>${close}</div><p>Linux · headless service · connected</p><div class="checkrow"><span>Agent sessions</span><span>4 connected · 2 active turns</span></div><div class="checkrow"><span>Approval requests</span><span>${s.approved?'0':'1'} waiting</span></div><div class="checkrow"><span>Last event</span><span>8 seconds ago</span></div><div class="notice">No desktop UI is running on Studio. Closing this client preserves its work and pending approvals.</div><button class="cursor-interaction" data-sheet="attention">Open attention inbox →</button>`;if(type==='attention')panel.innerHTML=`<div class="spread"><h2>Needs your attention</h2>${close}</div><div class="attentionitem"><div class="row"><span class="pill">Permission</span><h3>toolbar-styling · Studio</h3></div><p class="small muted">Run browser integration tests: npm run test:browser</p><p>The test launches a browser process on the Linux execution host. ${s.approved?'Approval recorded in the prototype.':'The agent is waiting; its worktree is preserved.'}</p><div class="row">${s.approved?'<span class="statustext small">Approved · prototype only</span>':'<button class="primary cursor-interaction" data-approve>Allow this test</button>'}<button class="cursor-interaction" data-jump="toolbar">Open worker</button></div></div><div class="attentionitem"><div class="row"><span class="pill">Review</span><h3>theme-init · PR #42</h3></div><p class="small muted">One reviewer thread is unresolved.</p><button class="cursor-interaction" data-jump="theme">Inspect PR →</button></div>`;icons();}
let saved=window.openai?.widgetState?.modelContent?.layoutStudies;
root.querySelectorAll('.studio').forEach(el=>{const design=el.dataset.design;el.innerHTML=baseMarkup(design);const previous=Array.isArray(saved)?saved.find(x=>x.layout===design):null;const s={el,design,entity:previous&&Object.keys(entities).find(k=>entities[k].name===previous.selected)||'theme',tab:['history','changes','pr','activity','usage'].includes(previous?.tab)?previous.tab:'history',selected:new Set(previous?.selectedCommits||[]),sent:[],paused:false,approved:false};sessions.push(s);render(s);el.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!el.contains(b))return;if(b.dataset.select){s.entity=b.dataset.select;s.selected.clear();s.paused=false;s.el.querySelector('textarea').value='';render(s);remember();}if(b.dataset.tab){s.tab=b.dataset.tab;render(s);remember();}if(b.hasAttribute('data-global-usage')){s.entity='project';s.tab='usage';render(s);remember();}if(b.dataset.commit){s.selected.has(b.dataset.commit)?s.selected.delete(b.dataset.commit):s.selected.add(b.dataset.commit);drawPane(s);remember();}if(b.hasAttribute('data-prepare')){const names=scopedCommits(s).filter(c=>s.selected.has(c.sha)).map(c=>`${c.sha} (${c.name})`).join(', ');s.el.querySelector('textarea').value=`Prepare a squash plan for ${names}. Show the resulting branch history before changing it.`;tell(s,'Squash instruction prepared for the selected agent.');}if(b.hasAttribute('data-address')){s.el.querySelector('textarea').value=`Address the unresolved review on PR #${prInfo(s).id}: ${prInfo(s).comment} Then rerun the relevant checks.`;tell(s,'Review instruction prepared.');}if(b.hasAttribute('data-send')){const area=el.querySelector('textarea');const value=area.value.trim();if(!value){tell(s,'Enter an instruction first.');return;}s.sent.push({entity:s.entity,text:value});area.value='';render(s);tell(s,`Prototype: message queued for ${entities[s.entity].name}.`);}if(b.hasAttribute('data-pause')){s.paused=!s.paused;render(s);tell(s,`Prototype: ${entities[s.entity].name} ${s.paused?'paused':'resumed'}.`);}if(b.dataset.sheet)sheet(s,b.dataset.sheet);if(b.hasAttribute('data-close'))el.querySelector('[data-sheet-panel]').hidden=true;if(b.dataset.jump){s.entity=b.dataset.jump;s.tab=s.entity==='theme'?'pr':'activity';el.querySelector('[data-sheet-panel]').hidden=true;render(s);remember();}if(b.hasAttribute('data-approve')){s.approved=true;el.querySelectorAll('[data-attention-count]').forEach(n=>n.textContent='1');sheet(s,'attention');tell(s,'Prototype: permission recorded.');}});
if(globalThis.Tweak){const choices={spacing:16,compact:false};const tweak=new Tweak({container:el,onChange:()=>{el.style.setProperty('--space',`${choices.spacing}px`);if(design==='score')el.querySelector('.projectscore').hidden=choices.compact;}});tweak.addSlider(choices,'spacing',{label:'Workspace padding',min:12,max:28,unit:'px'});if(design==='score')tweak.addToggle(choices,'compact',{label:'Hide project score'});}});
window.addEventListener('openai:set_globals',event=>{const choices=event.detail?.globals?.widgetState?.modelContent?.layoutStudies;if(!Array.isArray(choices))return;sessions.forEach(s=>{const value=choices.find(x=>x.layout===s.design);if(!value)return;const key=Object.keys(entities).find(k=>entities[k].name===value.selected);if(key)s.entity=key;if(['history','changes','pr','activity','usage'].includes(value.tab))s.tab=value.tab;s.selected=new Set(value.selectedCommits||[]);render(s);});});
})();
