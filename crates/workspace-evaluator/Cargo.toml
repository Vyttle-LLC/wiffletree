[package]
name = "workspace-evaluator"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
base64 = "0.22"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSTimer", "NSURL", "NSUserDefaults", "NSValue", "block2"] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFArray", "CFCGTypes", "CFDictionary", "CFMachPort", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGWindow"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSApplication", "NSBitmapImageRep", "NSBox", "NSButton", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSPanel", "NSScreen", "NSText", "NSTextField", "NSWindow", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "objc2-core-graphics"] }
objc2-screen-capture-kit = { version = "=0.3.2", features = ["SCScreenshotManager", "SCShareableContent", "SCStream", "block2", "objc2-core-foundation", "objc2-core-graphics"] }

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "wiffletree-evaluator"
path = "src/main.rs"
