[package]
name = "workspace-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
async-channel = "2.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
spake2 = "0.4"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3.23"
