[package]
name = "workspace-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
workspace-core.workspace = true
anyhow.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
gpui-component = { version = "=0.7.1", features = ["tree-sitter-languages"] }
async-channel = "2.5"
futures-lite = "2"
libc = "0.2"
# The Markdown parser gpui-component renders with, to find file references in messages.
markdown = "1.0.0"
# Converts a pasted image to PNG.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
objc = "0.2"
sha2 = "0.11"

[dev-dependencies]
# Tests serve a real host in a temporary folder; the app reaches its host only over host.sock.
workspace-host.workspace = true
tempfile = "3.23"
rusqlite = { version = "0.40", features = ["bundled"] }
# The board web view prototype (examples/board_webview/): wry places a WKWebView over a GPUI
# element, and the objc2 crates (the versions wry and GPUI already use) reach the WebKit and
# AppKit calls wry does not wrap: snapshots, first responder and synthetic input.
wry = { version = "=0.57.1", default-features = false }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSData", "NSError", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "=0.3.2", features = ["block2", "NSApplication", "NSEvent", "NSGraphicsContext", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "=0.3.2", features = ["block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }
block2 = "=0.6.2"

[[example]]
name = "board_webview"
# Runs the board scheme's tests with the others.
test = true
