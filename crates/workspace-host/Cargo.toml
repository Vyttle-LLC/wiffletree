[package]
name = "workspace-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
workspace-core.workspace = true
anyhow.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint", "functions"] }
sha2 = "0.11"
tempfile = "3.23"
async-channel = "2.5"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

chrono-tz = "0.10"
similar = "3.2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
serde_yaml = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"

[[bin]]
name = "workspace-host"
path = "src/main.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[example]]
name = "keychain_probe"
path = "examples/keychain_probe.rs"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"

[[example]]
name = "local_network_probe"
path = "examples/local_network_probe.rs"
