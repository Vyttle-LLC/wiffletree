# The brain gate: one deterministic check per call. A brain's caller runs it
# once per check, each in a job named after the check. See gate/README.md.
name: Brain gate
description: Run one of the brain gate's seven checks on a brain repository's pull request.

inputs:
  check:
    description: >-
      The check to run: secret-scan, sensitive-info, markdown-lint, wikilinks,
      log-schema, path-ownership or gate-tests.
    required: true

runs:
  using: composite
  steps:
    - name: Check the input
      shell: bash
      env:
        CHECK: ${{ inputs.check }}
      run: |
        case "$CHECK" in
          secret-scan|sensitive-info|markdown-lint|wikilinks|log-schema|path-ownership|gate-tests) ;;
          *) echo "::error::Unknown brain gate check '$CHECK'"; exit 2 ;;
        esac
        python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))' \
          || { echo "::error::The brain gate needs Python 3.11 or later"; exit 2; }

    - name: Install gitleaks
      if: inputs.check == 'secret-scan' || inputs.check == 'gate-tests'
      shell: bash
      env:
        VERSION: 8.30.1
        SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) arch=x64 sha256="$SHA256_X64" ;;
          Linux/ARM64) arch=arm64 sha256="$SHA256_ARM64" ;;
          *) echo "::error::The brain gate runs on Linux x64 or arm64 runners"; exit 2 ;;
        esac
        archive="gitleaks_${VERSION}_linux_${arch}.tar.gz"
        curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
        echo "${sha256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/brain-gate-bin"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/brain-gate-bin" gitleaks
        echo "$RUNNER_TEMP/brain-gate-bin" >> "$GITHUB_PATH"

    - name: Set up Node
      if: inputs.check == 'markdown-lint' || inputs.check == 'gate-tests'
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 22

    - name: Install markdownlint-cli2
      if: inputs.check == 'markdown-lint' || inputs.check == 'gate-tests'
      shell: bash
      run: npm install --global --no-fund --no-audit markdownlint-cli2@0.24.0

    - name: Run ${{ inputs.check }}
      shell: bash
      env:
        CHECK: ${{ inputs.check }}
        GATE: ${{ github.action_path }}
      run: |
        case "$CHECK" in
          secret-scan) python3 "$GATE/checks/secret_scan.py" ;;
          sensitive-info) python3 "$GATE/checks/sensitive_scan.py" ;;
          markdown-lint) python3 "$GATE/checks/markdown_lint.py" ;;
          wikilinks) python3 "$GATE/checks/wikilinks.py" ;;
          log-schema) python3 "$GATE/checks/log_schema.py" ;;
          path-ownership) python3 "$GATE/checks/path_ownership.py" ;;
          gate-tests) python3 -m unittest discover --start-directory "$GATE/tests" --verbose ;;
        esac
