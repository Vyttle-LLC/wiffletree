# Pull requests run only the lint job, which compiles every target on macOS. The merge queue runs the validation suite once per
# landing, and every push to main runs it again; the release workflow reuses it before publishing.
# The core and host tests are built once on Linux and run in four shards. macOS jobs lint, run the desktop tests, the tests that
# only build on macOS (the `mac` nextest profile) and the communication tests. On main and in a release, the whole suite also runs
# on macOS. The `check` job, which branch protection requires, passes only when every job that ran did. `github.event_name` is
# `push` in a release too, because a reusable workflow sees its caller's event.
# Only runs on main save the Rust build caches. Any other run can restore caches saved on its own ref or on main, so saving from
# main starts every new pull request and queue run warm; those and releases restore and never save, which keeps their caches from
# pushing main's out of the repository's cache limit.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:

# Only a newer push to a pull request replaces a run. Every other run has a group of its own, because a group holds one waiting
# run, so even without cancelling in progress a third push to main would cancel the second.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A retry that passes still shows as FLAKY in nextest's summary. A flaky test should not eject a stack from the queue.
  NEXTEST_RETRIES: ${{ github.event_name == 'merge_group' && 1 || 0 }}

jobs:
  linux-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Full debug info would make the archive each shard downloads about a gigabyte; line tables keep backtraces readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest

      - name: Build the core and host tests
        run: cargo nextest archive --locked -p workspace-core -p workspace-host --archive-file tests.tar.zst

      - name: List them
        run: cargo nextest list --archive-file tests.tar.zst --workspace-remap . --message-format oneline > linux-tests.txt

      - uses: actions/upload-artifact@v7
        with:
          name: linux-tests
          path: tests.tar.zst
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: linux-test-list
          path: linux-tests.txt
          retention-days: 1

  linux-tests:
    needs: linux-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The tests read fixtures from the checkout.
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v8
        with:
          name: linux-tests

      # Extracting into the checkout puts the binaries where the build job left them, so paths compiled into the tests resolve.
      - name: Run shard ${{ matrix.shard }} of 4
        run: >-
          cargo nextest run --archive-file tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite
          --partition count:${{ matrix.shard }}/4

  mac-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure the Metal toolchain
        run: xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  mac-tests:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest

      - name: Ensure the Metal toolchain
        run: xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Desktop and macOS-only tests
        run: cargo nextest run --locked --workspace --profile mac

      # Every core and host test macOS builds, and those the `mac` profile runs, for the `check` job's coverage check.
      # Listing the whole workspace reuses the build above; `-p` would unify features differently and recompile.
      - name: List them
        run: |
          cargo nextest list --locked --workspace -E 'package(workspace-core) | package(workspace-host)' --message-format oneline > mac-tests.txt
          cargo nextest list --locked --workspace -E 'package(workspace-core) | package(workspace-host)' --profile mac --message-format oneline > mac-only-tests.txt

      - uses: actions/upload-artifact@v7
        with:
          name: mac-test-lists
          path: |
            mac-tests.txt
            mac-only-tests.txt
          retention-days: 1

      - name: Communication tests
        run: |
          cargo build --locked -p workspace-host
          python3 scripts/test_communications.py

  mac-full-suite:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest

      - name: Ensure the Metal toolchain
        run: xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Rust tests
        run: cargo nextest run --locked --workspace

  check:
    needs: [linux-build, linux-tests, mac-lint, mac-tests, mac-full-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          pattern: '*-test-list*'
          merge-multiple: true

      # A core or host test macOS builds but Linux does not runs only if the `mac` profile selects it.
      - name: Every core and host test runs in the merge queue
        if: github.event_name != 'pull_request'
        run: |
          sort -u linux-tests.txt mac-only-tests.txt > covered.txt
          sort mac-tests.txt | comm -23 - covered.txt > uncovered.txt
          if [ -s uncovered.txt ]; then
            echo "Only macOS builds these tests, and the mac profile in .config/nextest.toml does not select them:"
            cat uncovered.txt
            exit 1
          fi
