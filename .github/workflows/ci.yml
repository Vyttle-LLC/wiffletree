# Runs the validation suite on pull requests and main; the release workflow reuses it before publishing.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Ensure the Metal toolchain
        run: xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --workspace

      - name: Communication tests
        run: |
          cargo build --locked -p workspace-host
          python3 scripts/test_communications.py
