# Runs the fixture tests of the checks the app's scan bundles, on every change under gate/.
name: Scan check tests

on:
  pull_request:
    paths:
      - 'gate/**'
      - '.github/workflows/brain-gate-tests.yml'
  push:
    branches: [main]
    paths:
      - 'gate/**'
      - '.github/workflows/brain-gate-tests.yml'

permissions:
  contents: read

concurrency:
  group: brain-gate-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-tests:
    name: scan-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/scan-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/scan-bin" gitleaks
          echo "$RUNNER_TEMP/scan-bin" >> "$GITHUB_PATH"
      - name: Run the tests
        run: python3 gate/tests/test_gate.py
