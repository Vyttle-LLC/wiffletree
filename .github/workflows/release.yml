# Publishes a signed, notarized macOS build when a version tag such as v0.2.0 is pushed.
# Installed release builds find it through the GitHub Releases feed and update themselves.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: [self-hosted, macOS, ARM64]
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to confirm the tag is on main.
          clean: false # Keep target/ between runs; tracked files are still reset.

      - uses: dtolnay/rust-toolchain@stable

      - name: Ensure the Metal toolchain
        run: xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"; exit 1
          fi
          echo "WIFFLETREE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Sign by hash from this keychain alone; the runner's login keychain may hold the same certificate.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package
        run: bash scripts/package_macos.sh

      - name: Notarize
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          ditto -c -k --keepParent target/Wiffletree.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --key "$RUNNER_TEMP/api-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple target/Wiffletree.app

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="Wiffletree-$WIFFLETREE_VERSION-macos-arm64.zip"
          ditto -c -k --keepParent target/Wiffletree.app "$archive"
          # A release drafted in GitHub's UI already exists; attach the build to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" \
              --title "Wiffletree $WIFFLETREE_VERSION" --verify-tag --generate-notes
          fi

      # The runner is a persistent Mac: remove the signing keychain and key files from it.
      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/api-key.p8" "$RUNNER_TEMP/notarize.zip"
